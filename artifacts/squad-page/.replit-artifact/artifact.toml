kind = "web"
previewPath = "/"
title = "Comunidade SQUAD"
version = "1.0.0"
id = "artifacts/squad-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25203
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/squad-page run dev"

[services.env]
PORT = "25203"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/squad-page", "run", "build"]
publicDir = "artifacts/squad-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
